[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcc"
version = "0.1.1"
description = "Utility to erase all __pycache__ folders recursively"
authors = [
  { name="Simon R. Lincoln" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
pcc = "pcc.cli:main"
